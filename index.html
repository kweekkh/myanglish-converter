<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Myanglish to Burmese (Auto)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Pyidaungsu&family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Outfit', 'Pyidaungsu', sans-serif;
            background: #f0f2f5;
            min-height: 100vh;
        }
        .app-card {
            background: white;
            border-radius: 24px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
        }
        .myanmar-text {
            font-family: 'Pyidaungsu', serif;
            line-height: 1.6;
        }
        .loader {
            border-top-color: #764ba2;
            animation: spinner 0.6s linear infinite;
        }
        @keyframes spinner {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
        }
    </style>
</head>
<body class="p-4 md:p-8 flex items-center justify-center">

    <div class="max-w-xl w-full app-card p-6 md:p-8">
        <div class="flex items-center justify-between mb-6">
            <div class="flex items-center gap-3">
                <div class="p-3 bg-purple-100 rounded-2xl">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-purple-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
                    </svg>
                </div>
                <div>
                    <h1 class="text-2xl font-bold text-gray-800">Smart AI Converter</h1>
                    <p class="text-xs text-gray-400 font-medium uppercase tracking-tighter">Auto-translation active (1s delay)</p>
                </div>
            </div>
            <div id="statusIndicator" class="flex items-center gap-2 text-xs font-semibold text-gray-400">
                <span id="statusDot" class="status-dot bg-gray-300"></span>
                <span id="statusText">Ready</span>
            </div>
        </div>

        <div class="space-y-5">
            <!-- Input -->
            <div class="relative">
                <textarea 
                    id="userInput" 
                    placeholder="Type Myanglish here..."
                    class="w-full p-5 bg-gray-50 border-2 border-transparent rounded-3xl focus:border-purple-500 focus:bg-white outline-none transition-all text-lg h-40 resize-none shadow-inner"
                ></textarea>
                
                <!-- Floating Loader -->
                <div id="floatingLoader" class="hidden absolute bottom-4 right-4">
                    <div class="loader w-6 h-6 border-3 border-purple-600 border-t-transparent rounded-full"></div>
                </div>
            </div>

            <!-- Output Area -->
            <div id="resultArea" class="transition-all duration-500 opacity-0 transform translate-y-4">
                <div class="flex items-center justify-between mb-2 px-1">
                    <span class="text-sm font-bold text-purple-600 uppercase tracking-widest">Burmese Result</span>
                    <button onclick="copyToClipboard()" id="copyBtn" class="bg-purple-50 text-purple-600 px-3 py-1 rounded-full text-xs font-bold hover:bg-purple-100 transition-colors">Copy Text</button>
                </div>
                <div 
                    id="aiOutput" 
                    class="w-full p-6 bg-gradient-to-br from-purple-50 to-white border border-purple-100 rounded-3xl text-2xl myanmar-text text-purple-900 min-h-[120px] shadow-sm"
                ></div>
            </div>
        </div>

        <div id="errorBox" class="hidden mt-4 p-3 bg-red-50 text-red-600 text-sm rounded-xl text-center font-medium border border-red-100"></div>
    </div>

    <script>
        const apiKey = ""; 
        const modelName = "gemini-2.5-flash-preview-09-2025";
        
        let timeout = null;
        const userInput = document.getElementById('userInput');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        const floatingLoader = document.getElementById('floatingLoader');
        const resultArea = document.getElementById('resultArea');
        const aiOutput = document.getElementById('aiOutput');
        const errorBox = document.getElementById('errorBox');

        // Typing event listener
        userInput.addEventListener('input', () => {
            // Reset state
            clearTimeout(timeout);
            errorBox.classList.add('hidden');
            
            if (userInput.value.trim() === "") {
                setIdleState();
                resultArea.classList.add('opacity-0', 'translate-y-4');
                return;
            }

            // User is typing
            setTypingState();

            // Set timeout for 2 seconds (2000ms)
            timeout = setTimeout(() => {
                convertWithAI();
            }, 2000);
        });

        async function convertWithAI() {
            const text = userInput.value.trim();
            if (!text) return;

            setLoadingState();

            const systemPrompt = "You are a Myanglish-to-Burmese translation tool. Convert Myanglish phonetics into natural Burmese text. Only return the Burmese text. Abbreviations: 'p'='ပြီ', 'nay'='နေ', 'tg'='တောင်', 'lar'='လား', 'tal'='တယ်'. Example: 'mae tg nay p' -> 'မေ့တောင်နေပြီ'. Keep the tone natural and informal if the input is informal.";

            try {
                const response = await fetchWithRetry(
                    `https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${apiKey}`,
                    {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: text }] }],
                            systemInstruction: { parts: [{ text: systemPrompt }] }
                        })
                    }
                );

                const data = await response.json();
                const result = data.candidates?.[0]?.content?.parts?.[0]?.text?.trim();

                if (result) {
                    aiOutput.innerText = result;
                    resultArea.classList.remove('opacity-0', 'translate-y-4');
                    setSuccessState();
                } else {
                    throw new Error("AI could not generate a result.");
                }

            } catch (err) {
                errorBox.innerText = "Error: " + err.message;
                errorBox.classList.remove('hidden');
                setIdleState();
            }
        }

        // UI State Helpers
        function setIdleState() {
            statusDot.className = "status-dot bg-gray-300";
            statusText.innerText = "Ready";
            floatingLoader.classList.add('hidden');
        }

        function setTypingState() {
            statusDot.className = "status-dot bg-yellow-400 animate-pulse";
            statusText.innerText = "Waiting...";
            floatingLoader.classList.add('hidden');
        }

        function setLoadingState() {
            statusDot.className = "status-dot bg-purple-500";
            statusText.innerText = "Translating...";
            floatingLoader.classList.remove('hidden');
        }

        function setSuccessState() {
            statusDot.className = "status-dot bg-green-500";
            statusText.innerText = "Translated";
            floatingLoader.classList.add('hidden');
        }

        async function fetchWithRetry(url, options, retries = 5, backoff = 1000) {
            for (let i = 0; i < retries; i++) {
                try {
                    const response = await fetch(url, options);
                    if (response.ok) return response;
                    if (response.status === 429) {
                        await new Promise(r => setTimeout(r, backoff));
                        backoff *= 2;
                        continue;
                    }
                } catch (e) {
                    if (i === retries - 1) throw e;
                    await new Promise(r => setTimeout(r, backoff));
                    backoff *= 2;
                }
            }
            throw new Error("Connection failed. Please try again.");
        }

        function copyToClipboard() {
            const text = aiOutput.innerText;
            const el = document.createElement('textarea');
            el.value = text;
            document.body.appendChild(el);
            el.select();
            document.execCommand('copy');
            document.body.removeChild(el);
            
            const copyBtn = document.getElementById('copyBtn');
            copyBtn.innerText = "Copied!";
            setTimeout(() => copyBtn.innerText = "Copy Text", 2000);
        }
    </script>
</body>
</html>
